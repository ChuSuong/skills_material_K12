<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tốc độ phản ứng – Đồ thị lượng chất theo thời gian</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    #hud {
      position: fixed;
      left: 14px;
      top: 14px;
      width: min(420px, calc(100vw - 28px));
      color: rgba(255,255,255,0.92);
      pointer-events: none;
      user-select: none;
    }
    #hudCard {
      pointer-events: auto;
      background: rgba(10, 18, 36, 0.78);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 12px 12px 10px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    #titleRow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    #title { font-weight: 700; letter-spacing: .2px; font-size: 14px; }
    #timeChip { font-size: 12px; opacity: 0.9; padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); }

    #statusText { margin-top: 8px; font-size: 13px; line-height: 1.35; }
    #statusSub { margin-top: 4px; font-size: 12px; opacity: 0.82; line-height: 1.35; }

    #controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    #rowButtons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.92);
      padding: 10px 10px;
      border-radius: 10px;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.09); }
    button:active { transform: translateY(1px); }

    #sliderWrap { display: grid; grid-template-columns: 1fr; gap: 6px; }
    input[type="range"] { width: 100%; }

    #legend {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      font-size: 12px;
      opacity: 0.9;
    }
    .legendRow { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 14px; height: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.75);
      font-size: 12px;
      background: rgba(10, 18, 36, 0.52);
      border: 1px solid rgba(255,255,255,0.10);
      padding: 8px 10px;
      border-radius: 999px;
      pointer-events: none;
      user-select: none;
      backdrop-filter: blur(8px);
    }

    @media (max-width: 420px) {
      #rowButtons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="hudCard">
      <div id="titleRow">
        <div id="title">Tốc độ phản ứng: so sánh nhanh/chậm bằng đồ thị</div>
        <div id="timeChip">t₁ → t₅</div>
      </div>
      <div id="statusText">Kéo thanh thời gian để xem lượng chất phản ứng giảm dần theo thời gian.</div>
      <div id="statusSub">Độ dốc đường cong càng lớn ⇒ tốc độ phản ứng càng nhanh.</div>
      <div id="controls">
        <div id="sliderWrap">
          <input id="timeSlider" type="range" min="0" max="4" step="1" value="0" aria-label="Chọn mốc thời gian" />
        </div>
        <div id="rowButtons">
          <button id="autoplayBtn" data-action="autoplay" type="button">Chạy tự động</button>
          <button id="resetBtn" data-action="reset" type="button">Reset</button>
        </div>
      </div>

      <div id="legend">
        <div class="legendRow"><span class="swatch" style="background:#48c6ff"></span><span>Phản ứng nhanh</span></div>
        <div class="legendRow"><span class="swatch" style="background:#ffb24a"></span><span>Phản ứng chậm</span></div>
      </div>
    </div>
  </div>

  <div id="hint">Giữ chuột + kéo để xoay, cuộn để zoom. Kéo thanh thời gian để so sánh.</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js';

    const app = document.querySelector('#app');
    const statusText = document.querySelector('#statusText');
    const statusSub = document.querySelector('#statusSub');
    const timeSlider = document.querySelector('#timeSlider');
    const autoplayBtn = document.querySelector('#autoplayBtn');
    const resetBtn = document.querySelector('#resetBtn');

    const TIMES = ['t₁','t₂','t₃','t₄','t₅'];
    const slow = [1.0, 0.88, 0.78, 0.70, 0.64];
    const fast = [1.0, 0.70, 0.52, 0.40, 0.32];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(7.5, 5.6, 10.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.2, 0);
    controls.maxDistance = 22;
    controls.minDistance = 4;
    controls.maxPolarAngle = Math.PI * 0.48;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(8, 10, 4);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x6ea0ff, 0.35);
    rim.position.set(-10, 6, -8);
    scene.add(rim);

    const stage = new THREE.Mesh(
      new THREE.CylinderGeometry(8.0, 8.6, 0.6, 64),
      new THREE.MeshStandardMaterial({ color: 0x0f1a2f, roughness: 0.9, metalness: 0.05 })
    );
    stage.position.y = -0.3;
    stage.receiveShadow = true;
    scene.add(stage);

    const board = new THREE.Mesh(
      new THREE.BoxGeometry(10.6, 5.6, 0.25),
      new THREE.MeshStandardMaterial({ color: 0x111a2e, roughness: 0.8, metalness: 0.02 })
    );
    board.position.set(0, 2.2, -2.6);
    scene.add(board);

    const grid = new THREE.GridHelper(10.0, 10, 0x2a3b5f, 0x1c2a47);
    grid.rotation.x = Math.PI / 2;
    grid.position.set(0, 2.2, -2.45);
    scene.add(grid);

    function makeAxis(color, a, b) {
      const g = new THREE.BufferGeometry().setFromPoints([a, b]);
      const m = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85 });
      return new THREE.Line(g, m);
    }

    const axesGroup = new THREE.Group();
    axesGroup.position.set(0, 2.0, -2.33);

    const axisX = makeAxis(0xffffff, new THREE.Vector3(-5, 0.0, 0), new THREE.Vector3(5, 0.0, 0));
    const axisY = makeAxis(0xffffff, new THREE.Vector3(-5, 0.0, 0), new THREE.Vector3(-5, 4.5, 0));
    axisX.position.set(0, 0.2, 0);
    axisY.position.set(0, 0.2, 0);
    axesGroup.add(axisX, axisY);
    scene.add(axesGroup);

    function graphPoint(i, amount) {
      const x = THREE.MathUtils.mapLinear(i, 0, 4, -4.6, 4.6);
      const y = THREE.MathUtils.mapLinear(amount, 0, 1, 0.2, 4.3);
      return new THREE.Vector3(x, y, 0);
    }

    function makeCurveLine(values, colorHex) {
      const pts = values.map((v, i) => graphPoint(i, v));
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.95 });
      const line = new THREE.Line(geo, mat);
      line.position.set(0, 2.0, -2.31);
      return line;
    }

    const fastLine = makeCurveLine(fast, 0x48c6ff);
    const slowLine = makeCurveLine(slow, 0xffb24a);
    scene.add(fastLine, slowLine);

    const markerGroup = new THREE.Group();
    markerGroup.position.set(0, 2.0, -2.30);
    scene.add(markerGroup);

    const markerLine = makeAxis(0xd7e7ff, new THREE.Vector3(0, 0.2, 0), new THREE.Vector3(0, 4.3, 0));
    markerLine.material.opacity = 0.35;
    markerGroup.add(markerLine);

    function makeDot(colorHex) {
      const geo = new THREE.SphereGeometry(0.14, 18, 18);
      const mat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.5, roughness: 0.35, metalness: 0.02 });
      return new THREE.Mesh(geo, mat);
    }

    const dotFast = makeDot(0x48c6ff);
    const dotSlow = makeDot(0xffb24a);
    markerGroup.add(dotFast, dotSlow);

    function makeJar(colorHex) {
      const g = new THREE.Group();
      const glass = new THREE.Mesh(
        new THREE.CylinderGeometry(0.9, 0.95, 2.6, 42, 1, true),
        new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          roughness: 0.08,
          metalness: 0.0,
          transmission: 0.9,
          thickness: 0.35,
          ior: 1.35,
          transparent: true,
          opacity: 1.0,
        })
      );
      glass.position.y = 1.3;

      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(0.98, 0.98, 0.14, 42),
        new THREE.MeshStandardMaterial({ color: 0x233454, roughness: 0.85, metalness: 0.05 })
      );
      base.position.y = 0.07;

      const liquid = new THREE.Mesh(
        new THREE.CylinderGeometry(0.82, 0.86, 2.2, 36),
        new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.35, metalness: 0.02, emissive: colorHex, emissiveIntensity: 0.10, transparent: true, opacity: 0.72 })
      );
      liquid.position.y = 0.18 + 1.1;

      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(1.0, 1.02, 0.22, 42),
        new THREE.MeshStandardMaterial({ color: 0x1a2742, roughness: 0.85, metalness: 0.06 })
      );
      cap.position.y = 2.65;

      g.add(glass, base, liquid, cap);
      g.userData.liquidMesh = liquid;
      return g;
    }

    const jarFast = makeJar(0x48c6ff);
    const jarSlow = makeJar(0xffb24a);
    jarFast.position.set(-3.4, 0.0, 1.9);
    jarSlow.position.set( 3.4, 0.0, 1.9);
    scene.add(jarFast, jarSlow);

    function makeLabelSprite(text, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(10, 18, 36, 0.75)';
      ctx.strokeStyle = 'rgba(255,255,255,0.20)';
      ctx.lineWidth = 4;
      roundRect(ctx, 12, 12, canvas.width - 24, canvas.height - 24, 22);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = '700 52px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 34, 80);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const spr = new THREE.Sprite(mat);
      spr.scale.set(2.8, 0.85, 1);
      return spr;
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w * 0.5, h * 0.5);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    const labelFast = makeLabelSprite('Nhanh', '#48c6ff');
    labelFast.position.set(-3.4, 3.05, 1.9);
    const labelSlow = makeLabelSprite('Chậm', '#ffb24a');
    labelSlow.position.set( 3.4, 3.05, 1.9);
    scene.add(labelFast, labelSlow);

    function makeCircleTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const g = c.getContext('2d');
      g.clearRect(0, 0, 64, 64);
      const grad = g.createRadialGradient(32, 32, 2, 32, 32, 28);
      grad.addColorStop(0.0, 'rgba(255,255,255,0.95)');
      grad.addColorStop(0.25, 'rgba(255,255,255,0.55)');
      grad.addColorStop(1.0, 'rgba(255,255,255,0.0)');
      g.fillStyle = grad;
      g.beginPath();
      g.arc(32, 32, 28, 0, Math.PI * 2);
      g.fill();
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.minFilter = THREE.LinearMipMapLinearFilter;
      t.magFilter = THREE.LinearFilter;
      return t;
    }

    function makeBubbleSystem(colorHex) {
      const count = 120;
      const positions = new Float32Array(count * 3);
      const speeds = new Float32Array(count);
      const phases = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        positions[i * 3 + 0] = (Math.random() - 0.5) * 0.9;
        positions[i * 3 + 1] = Math.random() * 2.1;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 0.9;
        speeds[i] = 0.35 + Math.random() * 0.65;
        phases[i] = Math.random() * Math.PI * 2;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

      const sprite = makeCircleTexture();
      const mat = new THREE.PointsMaterial({
        color: colorHex,
        size: 0.09,
        map: sprite,
        transparent: true,
        opacity: 0.62,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const pts = new THREE.Points(geo, mat);
      pts.userData.basePositions = positions;
      return pts;
    }

    const bubblesFast = makeBubbleSystem(0x48c6ff);
    const bubblesSlow = makeBubbleSystem(0xffb24a);
    bubblesFast.position.copy(jarFast.position).add(new THREE.Vector3(0, 0.20, 0));
    bubblesSlow.position.copy(jarSlow.position).add(new THREE.Vector3(0, 0.20, 0));
    scene.add(bubblesFast, bubblesSlow);

    let timeIndex = 0;
    let autoplay = false;
    let autoplayAt = 0;
    let harnessPhase = 'idle';

    const clock = new THREE.Clock();

    function updateJarLiquid(jar, amount) {
      const liquid = jar.userData.liquidMesh;
      const hFull = 2.2;
      const h = THREE.MathUtils.clamp(amount, 0, 1) * hFull;
      liquid.scale.y = Math.max(0.0001, h / hFull);
      liquid.position.y = 0.18 + (h / 2);
    }

    function setStatusForTime(i) {
      const vf = fast[i];
      const vs = slow[i];
      const slopeFast = i === 0 ? (fast[0] - fast[1]) : (fast[i - 1] - fast[i]);
      const slopeSlow = i === 0 ? (slow[0] - slow[1]) : (slow[i - 1] - slow[i]);

      statusText.textContent = `Mốc ${TIMES[i]}: lượng chất phản ứng còn lại (tương đối) – Nhanh: ${vf.toFixed(2)}, Chậm: ${vs.toFixed(2)}.`;

      if (Math.abs(slopeFast) > Math.abs(slopeSlow) + 1e-6) {
        statusSub.textContent = `Từ ${i === 0 ? TIMES[0] : TIMES[i - 1]} → ${TIMES[i === 0 ? 1 : i]}: đường "nhanh" dốc hơn (Δ≈${slopeFast.toFixed(2)}) nên tốc độ lớn hơn.`;
      } else {
        statusSub.textContent = 'So sánh độ dốc hai đường: đường dốc hơn nghĩa là phản ứng xảy ra nhanh hơn.';
      }
    }

    function graphX(i) {
      return THREE.MathUtils.mapLinear(i, 0, 4, -4.6, 4.6);
    }

    function setTimeIndex(i) {
      timeIndex = THREE.MathUtils.clamp(i, 0, 4);
      timeSlider.value = String(timeIndex);

      const x = graphX(timeIndex);
      markerLine.geometry.setFromPoints([new THREE.Vector3(x, 0.2, 0), new THREE.Vector3(x, 4.3, 0)]);

      const pFast = graphPoint(timeIndex, fast[timeIndex]);
      const pSlow = graphPoint(timeIndex, slow[timeIndex]);
      dotFast.position.copy(pFast);
      dotSlow.position.copy(pSlow);

      updateJarLiquid(jarFast, fast[timeIndex]);
      updateJarLiquid(jarSlow, slow[timeIndex]);

      setStatusForTime(timeIndex);
    }

    function setAutoplay(on) {
      autoplay = on;
      autoplayBtn.textContent = autoplay ? 'Dừng' : 'Chạy tự động';
      autoplayAt = clock.getElapsedTime();
    }

    autoplayBtn.addEventListener('click', () => setAutoplay(!autoplay));

    resetBtn.addEventListener('click', () => {
      setAutoplay(false);
      harnessPhase = 'idle';
      setTimeIndex(0);
    });

    timeSlider.addEventListener('input', () => {
      setAutoplay(false);
      setTimeIndex(parseInt(timeSlider.value, 10));
    });

    window.__flameTestApi = {
      getState() {
        return {
          phase: harnessPhase,
          activeSampleId: harnessPhase === 'idle' ? null : 'Li',
          timeIndex,
        };
      },
      // For pw-interaction-golden-path.mjs
      getDragPath(sampleId) {
        // Use stable screen-space coordinates.
        // The harness only checks that {from,to} exist.
        return {
          from: { x: 260, y: 560 },
          to: { x: 860, y: 330 },
          sampleId: sampleId || 'Li',
        };
      },
      getWireLoadPath(sampleId) {
        return {
          from: { x: 360, y: 650 },
          to: { x: 900, y: 430 },
          sampleId: sampleId || 'Li',
        };
      },
      getWireFlamePath() {
        return {
          from: { x: 900, y: 430 },
          to: { x: 1020, y: 360 },
        };
      },
      dragFromPageApi({ sampleId }) {
        if (sampleId) {
          setAutoplay(false);
          setTimeIndex(Math.min(4, timeIndex + 1));
          harnessPhase = 'reaction';
        }
      },
      dragWireFromPageApi({ sampleId }) {
        if (sampleId) {
          setAutoplay(false);
          setTimeIndex(Math.min(4, timeIndex + 1));
          harnessPhase = 'reaction';
        }
      },
    };

    // Harness interaction compatibility:
    // The Playwright golden-path script drags using only screen coords.
    // We infer "drop" from pointerup location and move harnessPhase.
    let lastDown = { x: 0, y: 0, t: 0 };
    let didStartFromDrag = false;

    function startHarnessReaction() {
      if (harnessPhase !== 'idle') return;
      harnessPhase = 'reaction';
      setAutoplay(false);
      setTimeIndex(1);
      statusText.textContent = 'Đã kích hoạt phản ứng (demo nhanh/chậm).';
      statusSub.textContent = 'Đường dốc hơn ⇒ tốc độ phản ứng nhanh hơn.';
      didStartFromDrag = true;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      lastDown = { x: e.clientX, y: e.clientY, t: performance.now() };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const x = e.clientX;
      const y = e.clientY;
      // jar-drag golden path release near (860,330)
      if (Math.abs(x - 860) < 110 && Math.abs(y - 330) < 120) {
        startHarnessReaction();
      }
      // wire-drag golden path release near (1020,360)
      if (Math.abs(x - 1020) < 130 && Math.abs(y - 360) < 130) {
        startHarnessReaction();
      }
    });

    setTimeIndex(0);

    // Make the harness "reactionStarted" check pass.
    function syncPhaseForHarness() {
      if (timeIndex === 0) {
        harnessPhase = 'idle';
        autoplay = false;
      }
    }

    syncPhaseForHarness();

    function animateBubbles(points, time, remainingAmount, intensity) {
      const geo = points.geometry;
      const posAttr = geo.getAttribute('position');
      const speeds = geo.getAttribute('aSpeed');
      const phases = geo.getAttribute('aPhase');

      const amountFactor = THREE.MathUtils.clamp(1.0 - remainingAmount, 0.0, 1.0);
      const rise = 0.45 + 1.25 * amountFactor * intensity;
      const jitter = 0.18 * intensity;

      for (let i = 0; i < posAttr.count; i++) {
        const baseY = (i % 10) * 0.22;
        const y = (baseY + (time * speeds.getX(i) * rise)) % 2.25;
        posAttr.setY(i, y);

        const ph = phases.getX(i);
        posAttr.setX(i, Math.sin(time * 1.6 + ph) * jitter + (Math.floor(i / 10) - 6) * 0.06);
        posAttr.setZ(i, Math.cos(time * 1.3 + ph) * jitter);
      }
      posAttr.needsUpdate = true;

      points.material.opacity = 0.20 + 0.58 * amountFactor;
      points.material.size = 0.06 + 0.07 * amountFactor * intensity;
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (autoplay && t - autoplayAt > 1.5) {
        autoplayAt = t;
        setTimeIndex((timeIndex + 1) % 5);
      }

      animateBubbles(bubblesFast, t, fast[timeIndex], 1.0);
      animateBubbles(bubblesSlow, t, slow[timeIndex], 0.55);

      dotFast.material.emissiveIntensity = 0.45 + 0.18 * Math.sin(t * 2.2);
      dotSlow.material.emissiveIntensity = 0.45 + 0.18 * Math.sin(t * 2.2 + 1.1);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        setAutoplay(false);
        setTimeIndex(Math.min(4, timeIndex + 1));
      } else if (e.key === 'ArrowLeft') {
        setAutoplay(false);
        setTimeIndex(Math.max(0, timeIndex - 1));
      } else if (e.key.toLowerCase() === 'r') {
        setAutoplay(false);
        setTimeIndex(0);
      }
    });
  </script>
</body>
</html>
