<!-- TEMPLATE: ai-quiz-gen.html
     Tính năng:
     - Nhập chủ đề / tên chương → Claude API sinh bộ câu hỏi JSON
     - Render quiz tương tác hoàn chỉnh với phân tử 3D nếu liên quan
     - Kết quả cuối: điểm số + review từng câu
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;padding:0 0 16px}
input,select{font-family:sans-serif;border:0.5px solid var(--color-border-secondary);border-radius:10px;background:var(--color-background-primary);color:var(--color-text-primary);padding:9px 14px;font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--color-text-info)}
button{font-family:sans-serif;cursor:pointer}
</style>

<!-- Config panel -->
<div id="config-panel">
  <div style="font-size:16px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px">Tạo quiz hoá học tự động</div>
  <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">AI sẽ tạo câu hỏi từ chủ đề bạn chọn</div>

  <div style="display:grid;gap:10px;margin-bottom:14px">
    <div>
      <label style="font-size:12px;color:var(--color-text-tertiary);display:block;margin-bottom:4px">Chủ đề / tên chương</label>
      <input id="topic" style="width:100%" placeholder="vd: Liên kết hoá học, Ankan, Axit-Bazơ, Este-Lipit..." />
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1">
        <label style="font-size:12px;color:var(--color-text-tertiary);display:block;margin-bottom:4px">Số câu hỏi</label>
        <select id="num-q" style="width:100%">
          <option value="3">3 câu (nhanh)</option>
          <option value="5" selected>5 câu (thường)</option>
          <option value="8">8 câu (đầy đủ)</option>
        </select>
      </div>
      <div style="flex:1">
        <label style="font-size:12px;color:var(--color-text-tertiary);display:block;margin-bottom:4px">Độ khó</label>
        <select id="difficulty" style="width:100%">
          <option value="easy">Dễ (lớp 10)</option>
          <option value="mixed" selected>Hỗn hợp</option>
          <option value="hard">Khó (luyện thi)</option>
        </select>
      </div>
      <div style="flex:1">
        <label style="font-size:12px;color:var(--color-text-tertiary);display:block;margin-bottom:4px">Lớp</label>
        <select id="grade" style="width:100%">
          <option value="10">Hoá 10</option>
          <option value="11" selected>Hoá 11</option>
          <option value="12">Hoá 12</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Topic suggestions -->
  <div style="margin-bottom:14px">
    <div style="font-size:12px;color:var(--color-text-tertiary);margin-bottom:6px">Gợi ý nhanh:</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap" id="topic-suggestions"></div>
  </div>

  <button onclick="generateQuiz()" id="btn-gen"
    style="width:100%;padding:11px;font-size:14px;border-radius:10px;border:none;background:var(--color-text-info);color:#fff;font-weight:500">
    ✦ Tạo quiz với AI
  </button>
</div>

<!-- Loading -->
<div id="loading" style="display:none;text-align:center;padding:48px 0">
  <div style="font-size:14px;color:var(--color-text-secondary);margin-bottom:8px" id="loading-msg">AI đang soạn câu hỏi...</div>
  <div style="font-size:12px;color:var(--color-text-tertiary)">Thường mất 5–10 giây</div>
</div>

<!-- Quiz panel -->
<div id="quiz-panel" style="display:none"></div>

<script>
const TOPIC_SUGGESTIONS=["Liên kết hoá học","Bảng tuần hoàn","Ankan & Anken","Ancol & Axit","Este và Lipit","Glucozơ & Saccarozơ","Axit - Bazơ","Phản ứng oxi hoá khử","Kim loại kiềm","Hidrocacbon thơm"];
let questions=[],curQ=0,selected=null,answers={},done=false;

const ts=document.getElementById("topic-suggestions");
TOPIC_SUGGESTIONS.forEach(t=>{
  const btn=document.createElement("button");
  btn.textContent=t;
  btn.style.cssText="padding:4px 12px;font-size:12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary)";
  btn.onclick=()=>{document.getElementById("topic").value=t;};
  ts.appendChild(btn);
});

const LOADING_MSGS=["AI đang soạn câu hỏi...","Đang tìm kiến thức phù hợp...","Kiểm tra độ chính xác...","Sắp xong rồi!"];
let loadingIdx=0,loadingInterval;

async function generateQuiz(){
  const topic=document.getElementById("topic").value.trim();
  if(!topic){document.getElementById("topic").focus();return;}
  const numQ=document.getElementById("num-q").value;
  const diff=document.getElementById("difficulty").value;
  const grade=document.getElementById("grade").value;

  document.getElementById("config-panel").style.display="none";
  document.getElementById("quiz-panel").style.display="none";
  document.getElementById("loading").style.display="block";
  loadingIdx=0;
  loadingInterval=setInterval(()=>{
    loadingIdx=(loadingIdx+1)%LOADING_MSGS.length;
    document.getElementById("loading-msg").textContent=LOADING_MSGS[loadingIdx];
  },2500);

  const diffLabel={easy:"dễ, phù hợp học sinh mới học",mixed:"hỗn hợp (60% trung bình, 40% khó)",hard:"khó, dành cho ôn thi đại học"}[diff];
  const prompt=`Tạo ${numQ} câu hỏi trắc nghiệm hoá học về chủ đề: "${topic}" cho học sinh lớp ${grade} THPT Việt Nam.
Độ khó: ${diffLabel}.

Yêu cầu QUAN TRỌNG: Chỉ trả về JSON hợp lệ, không có text nào khác, không có markdown code block.

Format JSON:
{
  "title": "tên quiz",
  "questions": [
    {
      "question": "nội dung câu hỏi",
      "mol_cid": null,
      "options": ["A. ...", "B. ...", "C. ...", "D. ..."],
      "correct": 0,
      "explanation": "giải thích đáp án đúng (2-3 câu, dễ hiểu)",
      "difficulty": "easy|medium|hard"
    }
  ]
}

Lưu ý:
- mol_cid: điền PubChem CID nếu câu hỏi liên quan đến phân tử cụ thể (H2O=962, C6H6=241, C2H5OH=702, C6H12O6=5793, CH4=297, NH3=222, CO2=280), null nếu không
- correct: index 0-3 của đáp án đúng trong mảng options
- Giải thích phải ngắn gọn, dùng tiếng Việt, phù hợp học sinh THPT
- Các đáp án sai phải hợp lý (không quá dễ đoán)`;

  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user",content:prompt}]
      })
    });
    const data=await res.json();
    const raw=data.content[0].text.trim();
    const parsed=JSON.parse(raw);
    questions=parsed.questions;
    clearInterval(loadingInterval);
    document.getElementById("loading").style.display="none";
    curQ=0;selected=null;answers={};done=false;
    renderQuizTitle(parsed.title,topic,grade);
    renderQuestion();
    document.getElementById("quiz-panel").style.display="block";
  }catch(e){
    clearInterval(loadingInterval);
    document.getElementById("loading").style.display="none";
    document.getElementById("config-panel").style.display="block";
    alert("Lỗi tạo quiz: "+e.message+"\nThử lại nhé!");
  }
}

function renderQuizTitle(title,topic,grade){
  const panel=document.getElementById("quiz-panel");
  const header=document.createElement("div");
  header.style.cssText="margin-bottom:14px";
  header.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:16px;font-weight:500;color:var(--color-text-primary)">${title||"Quiz: "+topic}</span>
      <span style="font-size:12px;padding:2px 9px;border-radius:20px;background:var(--color-background-info);color:var(--color-text-info);font-weight:500">Hoá ${grade}</span>
      <button onclick="document.getElementById('config-panel').style.display='block';document.getElementById('quiz-panel').style.display='none'"
        style="margin-left:auto;font-size:12px;padding:3px 10px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary)">
        Tạo quiz mới
      </button>
    </div>`;
  panel.innerHTML="";
  panel.appendChild(header);
  const qDiv=document.createElement("div");
  qDiv.id="q-render";
  panel.appendChild(qDiv);
}

const DIFF_STYLE={easy:{bg:"var(--color-background-success)",fg:"var(--color-text-success)",lbl:"Dễ"},medium:{bg:"var(--color-background-warning)",fg:"var(--color-text-warning)",lbl:"TB"},hard:{bg:"var(--color-background-danger)",fg:"var(--color-text-danger)",lbl:"Khó"}};

function renderQuestion(){
  if(done){renderResult();return;}
  const q=questions[curQ];
  const answered=selected!==null;
  const dc=DIFF_STYLE[q.difficulty]||DIFF_STYLE.medium;
  const root=document.getElementById("q-render");

  root.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <div style="flex:1;height:4px;background:var(--color-border-tertiary);border-radius:4px">
        <div style="height:100%;border-radius:4px;background:var(--color-text-info);width:${(curQ+1)/questions.length*100}%;transition:width .3s"></div>
      </div>
      <span style="font-size:12px;color:var(--color-text-tertiary);white-space:nowrap">${curQ+1}/${questions.length}</span>
      <span style="font-size:11px;padding:2px 8px;border-radius:12px;background:${dc.bg};color:${dc.fg};font-weight:500">${dc.lbl}</span>
    </div>

    ${q.mol_cid?`<div style="border-radius:10px;overflow:hidden;border:0.5px solid var(--color-border-tertiary);margin-bottom:12px;background:#fff">
      <iframe src="https://embed.molview.org/v1/?mode=balls&cid=${q.mol_cid}&bg=white" allow="fullscreen" loading="lazy"
        style="width:100%;height:200px;border:none;display:block"></iframe>
      <div style="padding:6px 12px;font-size:12px;color:var(--color-text-tertiary);border-top:0.5px solid var(--color-border-tertiary)">PubChem CID: ${q.mol_cid}</div>
    </div>`:""}

    <div style="font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:14px;line-height:1.5">${q.question}</div>

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
      ${q.options.map((opt,i)=>{
        const isSel=selected===i,isAns=i===q.correct;
        let bg="var(--color-background-primary)",border="var(--color-border-secondary)",color="var(--color-text-primary)";
        if(answered){
          if(isAns){bg="var(--color-background-success)";border="var(--color-border-success)";color="var(--color-text-success)";}
          else if(isSel){bg="var(--color-background-danger)";border="var(--color-border-danger)";color="var(--color-text-danger)";}
        }
        return `<button onclick="if(!${answered}){selected=${i};answers[${curQ}]=${i};renderQuestion()}"
          style="text-align:left;padding:10px 14px;border-radius:10px;cursor:${answered?"default":"pointer"};
          border:0.5px solid ${border};background:${bg};color:${color};font-size:13px;
          display:flex;align-items:center;gap:10px">
          <span style="width:22px;height:22px;border-radius:50%;border:0.5px solid ${border};display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">
            ${answered&&isAns?"✓":answered&&isSel?"✗":String.fromCharCode(65+i)}
          </span>${opt}
        </button>`;
      }).join("")}
    </div>

    ${answered?`
    <div style="padding:10px 14px;border-radius:10px;margin-bottom:14px;line-height:1.6;font-size:13px;
      background:${selected===q.correct?"var(--color-background-success)":"var(--color-background-danger)"};
      border:0.5px solid ${selected===q.correct?"var(--color-border-success)":"var(--color-border-danger)"}">
      <div style="font-weight:500;color:${selected===q.correct?"var(--color-text-success)":"var(--color-text-danger)"};margin-bottom:4px">
        ${selected===q.correct?"✓ Chính xác!":"✗ Chưa đúng — Đáp án: "+q.options[q.correct]}
      </div>
      <div style="color:var(--color-text-primary)">${q.explanation}</div>
    </div>
    <button onclick="${curQ<questions.length-1?"curQ++;selected=answers[curQ]??null;renderQuestion()":"done=true;renderQuestion()"}"
      style="width:100%;padding:10px;font-size:13px;border-radius:10px;border:0.5px solid var(--color-border-secondary);
      background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500">
      ${curQ<questions.length-1?"Câu tiếp theo →":"Xem kết quả"}
    </button>`:""}
  `;
}

function renderResult(){
  const score=Object.entries(answers).filter(([i,a])=>questions[+i].correct===a).length;
  const pct=Math.round(score/questions.length*100);
  const root=document.getElementById("q-render");
  root.innerHTML=`
    <div style="text-align:center;padding:24px 16px;border:0.5px solid var(--color-border-tertiary);border-radius:12px;margin-bottom:14px">
      <div style="font-size:48px;font-weight:500;color:var(--color-text-primary);line-height:1">${pct}%</div>
      <div style="font-size:15px;color:var(--color-text-secondary);margin:8px 0 4px">${score}/${questions.length} câu đúng</div>
      <div style="font-size:13px;color:var(--color-text-tertiary)">${pct>=80?"Xuất sắc! Bạn nắm vững chủ đề này.":pct>=60?"Khá tốt! Ôn lại những câu sai nhé.":"Cần ôn tập thêm. Xem giải thích bên dưới."}</div>
      <button onclick="curQ=0;selected=null;answers={};done=false;renderQuestion()"
        style="margin-top:16px;padding:8px 24px;font-size:13px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary)">
        Làm lại
      </button>
    </div>
    ${questions.map((q,i)=>{
      const ua=answers[i],ok=ua===q.correct;
      return `<div style="margin-bottom:10px;padding:10px 14px;border-radius:10px;
        border:0.5px solid ${ok?"var(--color-border-success)":"var(--color-border-danger)"};
        background:${ok?"var(--color-background-success)":"var(--color-background-danger)"}">
        <div style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px">${i+1}. ${q.question}</div>
        <div style="font-size:12px;color:${ok?"var(--color-text-success)":"var(--color-text-danger)"}">${ok?"✓ Đúng":"✗ Sai — Đáp án: "+q.options[q.correct]}</div>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">${q.explanation}</div>
      </div>`;
    }).join("")}
  `;
}

document.getElementById("topic").addEventListener("keydown",e=>{if(e.key==="Enter")generateQuiz();});
</script>
