<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCHEME_TITLE | Học liệu Hoá học</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a}
.wrap{max-width:600px;margin:0 auto;padding:24px 16px 40px}
footer{margin-top:20px;font-size:12px;color:#aaa;text-align:center}
button{font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div id="root"></div>
  <footer>Học liệu Hoá học THPT · Phương pháp cân bằng electron</footer>
</div>

<script type="text/babel">
const { useState } = React;

// Bảng màu (tương đương var(--color-*) trong bản React artifact)
const C = {
  textPrimary: "#1a1a1a", textSecondary: "#555555", textTertiary: "#999999",
  bgPrimary: "#ffffff", bgSecondary: "#f0f0ee",
  borderSecondary: "#dddddd", borderTertiary: "#e5e5e5",
  textInfo: "#1d4ed8", bgInfo: "#dbeafe",
  textWarning: "#b45309", bgWarning: "#fef3c7",
  textSuccess: "#15803d", bgSuccess: "#dcfce7",
};

// ===== THAY DỮ LIỆU DATA (cấu trúc giống templates/redox-tracker.jsx) =====
const DATA = {
  title: "TITLE",
  subtitle: "SUBTITLE",
  unbalanced: "EQ_UNBALANCED",
  balanced: "EQ_BALANCED",
  processes: [
    { type: "oxidation", element: "EL1", before: "B1", after: "A1", half: "HALF_1", role: "ROLE_1", electronsPerUnit: 1, multiplier: 1 },
    { type: "reduction", element: "EL2", before: "B2", after: "A2", half: "HALF_2", role: "ROLE_2", electronsPerUnit: 1, multiplier: 1 },
  ],
};

const STEPS = ["Xác định số oxi hoá", "Viết 2 quá trình", "Cân bằng electron", "Hoàn thành PTHH"];

const ROLE_STYLE = {
  oxidation: { bg: C.bgWarning, fg: C.textWarning, label: "Oxi hoá" },
  reduction: { bg: C.bgInfo, fg: C.textInfo, label: "Khử" },
};

function RedoxTracker() {
  const [step, setStep] = useState(0);
  const [flow, setFlow] = useState(false);

  const ox = DATA.processes.find(p => p.type === "oxidation");
  const red = DATA.processes.find(p => p.type === "reduction");
  const totalEOx = ox.electronsPerUnit * ox.multiplier;
  const totalERed = red.electronsPerUnit * red.multiplier;
  const eMatch = totalEOx === totalERed;

  const OxNumBadge = ({ p }) => {
    const rs = ROLE_STYLE[p.type];
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: C.textPrimary }}>{p.element}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}>
          <span style={{ padding: "1px 8px", borderRadius: 8, background: C.bgSecondary, color: C.textSecondary }}>{p.before}</span>
          <span style={{ color: C.textTertiary }}>→</span>
          <span style={{ padding: "1px 8px", borderRadius: 8, background: rs.bg, color: rs.fg, fontWeight: 600 }}>{p.after}</span>
        </div>
        <div style={{ fontSize: 11, padding: "1px 8px", borderRadius: 10, background: rs.bg, color: rs.fg }}>
          {rs.label === "Oxi hoá" ? "Số oxi hoá tăng" : "Số oxi hoá giảm"}
        </div>
      </div>
    );
  };

  const ProcessCard = (p) => {
    const rs = ROLE_STYLE[p.type];
    return (
      <div style={{ flex: 1, border: `0.5px solid ${rs.fg}`, borderRadius: 12, padding: "12px 14px", background: rs.bg }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: rs.fg, marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.4 }}>
          Quá trình {rs.label.toLowerCase()}
        </div>
        <div style={{ fontSize: 15, fontWeight: 600, color: C.textPrimary, marginBottom: 4, fontFamily: "monospace" }}>{p.half}</div>
        <div style={{ fontSize: 12, color: C.textSecondary }}>{p.role}</div>
      </div>
    );
  };

  const ElectronRow = (p, count) => (
    <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
      {Array.from({ length: count }).map((_, i) => (
        <div key={i} style={{
          width: 22, height: 22, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 10, fontWeight: 700, color: C.bgPrimary,
          background: ROLE_STYLE[p.type].fg,
          transform: flow ? (p.type === "oxidation" ? "translateX(40px)" : "translateX(-40px)") : "translateX(0)",
          transition: `transform .6s ease ${i * 0.06}s`,
        }}>e⁻</div>
      ))}
    </div>
  );

  const pillStyle = (on) => ({
    padding: "5px 14px", fontSize: 12, borderRadius: 20, cursor: "pointer",
    border: on ? `1.5px solid ${C.textInfo}` : `0.5px solid ${C.borderSecondary}`,
    background: on ? C.bgInfo : C.bgPrimary,
    color: on ? C.textInfo : C.textSecondary,
    fontWeight: on ? 500 : 400,
  });

  return (
    <div style={{ fontFamily: "sans-serif", padding: "0 0 16px" }}>

      <div style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 18, fontWeight: 600, color: C.textPrimary }}>{DATA.title}</div>
        {DATA.subtitle && <div style={{ fontSize: 12, color: C.textTertiary, marginTop: 2 }}>{DATA.subtitle}</div>}
        <div style={{
          marginTop: 8, fontSize: 15, fontFamily: "monospace", fontWeight: 600, color: C.textPrimary,
          background: C.bgSecondary, padding: "6px 12px", borderRadius: 8, display: "inline-block",
        }}>{step < 3 ? DATA.unbalanced : DATA.balanced}</div>
      </div>

      <div style={{ display: "flex", marginBottom: 16, position: "relative" }}>
        <div style={{ position: "absolute", top: 14, left: 14, right: 14, height: "0.5px", background: C.borderTertiary, zIndex: 0 }} />
        {STEPS.map((label, i) => (
          <div key={i} onClick={() => setStep(i)}
            style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, cursor: "pointer", position: "relative", zIndex: 1 }}>
            <div style={{
              width: 28, height: 28, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 13, fontWeight: 500,
              border: i === step ? `2px solid ${C.textInfo}` : `0.5px solid ${C.borderSecondary}`,
              background: i < step ? C.textInfo : i === step ? C.bgInfo : C.bgPrimary,
              color: i < step ? C.bgPrimary : i === step ? C.textInfo : C.textTertiary,
              transition: "all .2s",
            }}>{i < step ? "✓" : i + 1}</div>
            <div style={{ fontSize: 11, textAlign: "center", color: i === step ? C.textInfo : C.textTertiary, fontWeight: i === step ? 500 : 400 }}>{label}</div>
          </div>
        ))}
      </div>

      <div style={{ border: `0.5px solid ${C.borderTertiary}`, borderRadius: 12, padding: 14, minHeight: 180, background: C.bgPrimary }}>

        {step === 0 && (
          <div>
            <p style={{ fontSize: 13, color: C.textSecondary, margin: "0 0 14px", lineHeight: 1.6 }}>
              So sánh số oxi hoá của từng nguyên tố ở 2 vế phương trình — nguyên tố nào thay đổi
              số oxi hoá thì tham gia quá trình oxi hoá - khử.
            </p>
            <div style={{ display: "flex", gap: 24, justifyContent: "center" }}>
              <OxNumBadge p={ox} />
              <OxNumBadge p={red} />
            </div>
          </div>
        )}

        {step === 1 && (
          <div>
            <p style={{ fontSize: 13, color: C.textSecondary, margin: "0 0 12px", lineHeight: 1.6 }}>
              Viết riêng quá trình nhường electron (oxi hoá) và quá trình nhận electron (khử):
            </p>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              {ProcessCard(ox)}
              {ProcessCard(red)}
            </div>
          </div>
        )}

        {step === 2 && (
          <div>
            <p style={{ fontSize: 13, color: C.textSecondary, margin: "0 0 12px", lineHeight: 1.6 }}>
              Tìm hệ số nhân cho mỗi quá trình sao cho tổng số electron nhường = tổng số electron nhận
              (bội chung nhỏ nhất - BCNN):
            </p>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
              <div style={{ flex: 1, border: `0.5px solid ${ROLE_STYLE.oxidation.fg}`, borderRadius: 12, padding: "10px 14px", background: ROLE_STYLE.oxidation.bg }}>
                <div style={{ fontSize: 12, color: ROLE_STYLE.oxidation.fg, fontWeight: 600, marginBottom: 4 }}>Oxi hoá</div>
                <div style={{ fontSize: 14, color: C.textPrimary, marginBottom: 6 }}>
                  {ox.electronsPerUnit}e⁻ × {ox.multiplier} = <strong>{totalEOx}e⁻</strong>
                </div>
                {ElectronRow(ox, totalEOx)}
              </div>
              <div style={{ flex: 1, border: `0.5px solid ${ROLE_STYLE.reduction.fg}`, borderRadius: 12, padding: "10px 14px", background: ROLE_STYLE.reduction.bg }}>
                <div style={{ fontSize: 12, color: ROLE_STYLE.reduction.fg, fontWeight: 600, marginBottom: 4 }}>Khử</div>
                <div style={{ fontSize: 14, color: C.textPrimary, marginBottom: 6 }}>
                  {red.electronsPerUnit}e⁻ × {red.multiplier} = <strong>{totalERed}e⁻</strong>
                </div>
                {ElectronRow(red, totalERed)}
              </div>
            </div>
            <button onClick={() => setFlow(f => !f)} style={{ ...pillStyle(flow), width: "100%", textAlign: "center" }}>
              {flow ? "↺ Reset minh hoạ" : "▶ Minh hoạ trao đổi electron"}
            </button>
            <div style={{
              marginTop: 10, textAlign: "center", fontSize: 13, fontWeight: 500,
              color: eMatch ? C.textSuccess : C.textWarning,
            }}>
              {eMatch ? `✓ Cân bằng: ${totalEOx}e⁻ nhường = ${totalERed}e⁻ nhận` : "Chưa cân bằng — kiểm tra lại hệ số"}
            </div>
          </div>
        )}

        {step === 3 && (
          <div>
            <p style={{ fontSize: 13, color: C.textSecondary, margin: "0 0 12px", lineHeight: 1.6 }}>
              Đưa các hệ số ({ox.multiplier} cho quá trình oxi hoá, {red.multiplier} cho quá trình khử)
              vào phương trình ban đầu, sau đó kiểm tra cân bằng số nguyên tử của tất cả nguyên tố còn lại
              (thường là cân bằng tiếp phần không đổi số oxi hoá).
            </p>
            <div style={{
              fontSize: 16, fontWeight: 600, color: C.textPrimary, fontFamily: "monospace",
              background: C.bgSuccess, padding: "12px 16px", borderRadius: 10, textAlign: "center",
            }}>{DATA.balanced}</div>
          </div>
        )}
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        <button onClick={() => setStep(s => Math.max(0, s - 1))} disabled={step === 0}
          style={{ flex: 1, padding: "9px", fontSize: 13, borderRadius: 10, cursor: step === 0 ? "default" : "pointer",
            border: `0.5px solid ${C.borderSecondary}`, background: C.bgPrimary,
            color: C.textPrimary, opacity: step === 0 ? 0.4 : 1 }}>
          ← Quay lại
        </button>
        <button onClick={() => setStep(s => Math.min(STEPS.length - 1, s + 1))} disabled={step === STEPS.length - 1}
          style={{ flex: 1, padding: "9px", fontSize: 13, borderRadius: 10,
            cursor: step === STEPS.length - 1 ? "default" : "pointer",
            border: `0.5px solid ${C.borderSecondary}`,
            background: step === STEPS.length - 1 ? C.bgPrimary : C.bgInfo,
            color: step === STEPS.length - 1 ? C.textPrimary : C.textInfo,
            opacity: step === STEPS.length - 1 ? 0.4 : 1, fontWeight: 500 }}>
          Tiếp theo →
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<RedoxTracker />);
</script>
</body>
</html>
