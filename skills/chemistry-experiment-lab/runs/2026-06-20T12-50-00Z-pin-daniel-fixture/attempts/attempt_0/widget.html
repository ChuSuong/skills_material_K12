<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pin điện hóa Zn-Cu</title>
</head>
<body>
  <section data-role="stage" style="min-height:320px;padding:20px;border-radius:24px;background:linear-gradient(180deg,#0b1830,#17365f);color:#eef6ff;font-family:Segoe UI,sans-serif;">
    <h1 style="margin:0 0 8px">Pin điện hóa Zn-Cu</h1>
    <p>Dự đoán trước: điện cực nào là <strong>anot</strong> và sẽ <strong>Zn tan dần</strong>?</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin:14px 0">
      <button>Chạy pin</button>
      <button>Làm lại</button>
    </div>
    <p>Quan sát: <strong>electron</strong> đi từ Zn sang Cu qua dây dẫn, còn <strong>cầu muối</strong> giữ trung hòa điện tích.</p>
    <p>Kết quả: thanh Zn mòn dần, còn ở điện cực đồng thì <strong>Cu bám dần</strong>.</p>
  </section>
</body>
</html>
